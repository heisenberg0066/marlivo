# MarLivo game server: one Cloudflare Worker + one Durable Object per room (spec §8).
# Free plan: SQLite-backed Durable Objects ("new_sqlite_classes"), WebSocket Hibernation API.
name = "marlivo"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limits"]

[vars]
# Origins allowed to open sockets / call the API (comma separated). "*" allows any origin.
ALLOWED_ORIGINS = "https://heisenberg0066.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
# Set to "0" to disable owner-key Test rooms entirely (§17.4).
ALLOW_TEST_ROOMS = "1"

# Secrets (never in this file). Set them once with:
#   npx wrangler secret put FRIENDS_KEY   (needed to create rooms)
#   npx wrangler secret put OWNER_KEY     (unlocks the owner-only Test room)
# For local development put them in apps/server/.dev.vars (git-ignored).
